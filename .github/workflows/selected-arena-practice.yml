name: Selected Arena match practice
on:
  push:
    branches: [practice/movement-nov22]
permissions:
  contents: read
jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check cryptography
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch
      - name: Fit movement on the selected recordings
        env:
          ARENA_NEURAL_CORPUS_TOKEN: ${{ secrets.ARENA_NEURAL_CORPUS_TOKEN }}
        run: python .github/movement-practice.py

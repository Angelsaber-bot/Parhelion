name: Arena neural training

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arena-training.yml'
      - 'arena-game/scripts/self-play-*'
      - 'arena-game/tools/train-self-play.py'
      - 'arena-game/tools/arena_camera_intent.py'
      - 'arena-game/tools/arena_recent_replay.py'
      - 'arena-game/tools/train-arena-policy.py'
      - 'arena-game/tools/player-demos.json'
      - 'arena-game/scripts/sample-control-practice.ts'
      - 'arena-game/shared/botNeuralControl.ts'
      - 'arena-game/shared/aimRecoil.ts'
      - 'arena-game/shared/humanCombat.ts'
      - 'arena-game/shared/exploration.ts'
      - 'arena-game/shared/trainingData.ts'
      - 'arena-game/shared/perceptualMotor.ts'
      - 'arena-game/shared/searchOcclusion.ts'
      - 'arena-game/shared/neuralPolicy.ts'
      - 'arena-game/scripts/evaluation/**'
  workflow_dispatch:
    inputs:
      pixel_audition:
        description: Verify pixel-only controls in a private rendered smoke match
        type: boolean
        default: false
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: arena-public-neural-training
  cancel-in-progress: false

jobs:
  train:
    if: github.ref == 'refs/heads/main' && vars.ARENA_TRAINING_PAUSED != 'true'
    outputs:
      selfplay_completed: ${{ steps.selfplay.outcome == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ARENA_PLAYER_DEMOS: ${{ github.workspace }}/arena-game/tools/player-demos.json
    steps:
      - name: Select training work
        id: work
        run: |
          python3 - <<'PYTHON'
          import json, os, urllib.request
          endpoint = 'https://parhelion-arena.lejiazhang-us.workers.dev/training/status'
          req = urllib.request.Request(endpoint, headers={'User-Agent': 'Parhelion-Arena-Training/1.0', 'Accept': 'application/json'})
          with urllib.request.urlopen(req, timeout=25) as response:
              status = json.load(response)
          corpus = status['dataset']
          previous = (status.get('transformer') or {}).get('completedRevision', 0)
          ready = bool(status.get('neuralExportConfigured'))
          # Bootstrap the first visual human reference once the self-play endpoint is deployed.
          selfplay = ready and 'reinforcement' in status and (previous > 0 or corpus['matches'] >= 2)
          refresh = ready and corpus['matches'] >= 2 and (not status.get('reinforcement') or os.environ['GITHUB_EVENT_NAME'] == 'push')
          reference = ready and corpus['matches'] >= 2 and (corpus['revision'] > previous or refresh)
          print(f"Human revision {corpus['revision']}; update reference={reference}, run self-play={selfplay}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key, flag in [('reference',reference), ('refresh',refresh), ('selfplay',selfplay), ('install',reference or selfplay)]:
                  print(f"{key}={str(flag).lower()}", file=out)
          PYTHON
      - uses: actions/checkout@v5
        if: steps.work.outputs.install == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        if: steps.work.outputs.install == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: arena-game/package-lock.json
      - uses: actions/setup-python@v5
        if: steps.work.outputs.install == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/arena-training.yml
      - name: Install training dependencies
        if: steps.work.outputs.install == 'true'
        run: |
          npm ci --prefix arena-game --no-audit --no-fund
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.15.0'
      - name: Update private human reference
        if: steps.work.outputs.reference == 'true'
        env:
          ARENA_NEURAL_CORPUS_TOKEN: ${{ secrets.ARENA_NEURAL_CORPUS_TOKEN }}
          REFRESH: ${{ steps.work.outputs.refresh }}
        run: |
          umask 077
          training_dir=$(mktemp -d "$RUNNER_TEMP/arena-training.XXXXXX")
          trap 'rm -rf "$training_dir"' EXIT
          extra=()
          if [ "$REFRESH" = true ]; then extra+=(--refresh-reference); fi
          ARENA_NEURAL_RUN_DIR="$training_dir" ARENA_NEURAL_PYTHON=python \
            npm run train:neural --prefix arena-game -- --public --cloud --reference-only --epochs 20 --device cpu "${extra[@]}"
      - name: Play fresh matches and optimize the neural policy
        id: selfplay
        if: steps.work.outputs.selfplay == 'true' && !cancelled()
        working-directory: arena-game
        env:
          ARENA_NEURAL_CORPUS_TOKEN: ${{ secrets.ARENA_NEURAL_CORPUS_TOKEN }}
          GENERATIONS: ${{ github.event_name == 'push' && '5' || '60' }}
        run: python scripts/self-play-cycle.py --cloud --generations "$GENERATIONS" --time-budget-seconds 720
      - name: Verify direct pixel control in a rendered Arena match
        if: github.event_name == 'workflow_dispatch' && inputs.pixel_audition && steps.work.outputs.install == 'true'
        working-directory: arena-game
        env:
          ARENA_NEURAL_CORPUS_TOKEN: ${{ secrets.ARENA_NEURAL_CORPUS_TOKEN }}
          ARENA_NEURAL_PYTHON: python
        run: CHROMIUM_EXECUTABLE="$(command -v google-chrome)" python scripts/self-play-cycle.py --cloud --camera-audit-only

  continue-training:
    needs: train
    if: needs.train.result == 'success' && needs.train.outputs.selfplay_completed == 'true' && vars.ARENA_TRAINING_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Queue the next batch from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A scheduled run or new push may already be waiting for this training slot.
          pending=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/arena-training.yml/runs" \
            -f branch=main -f head_sha="$GITHUB_SHA" -F per_page=20 --jq '[.workflow_runs[] | select(.status == "pending" or .status == "queued" or .status == "requested" or .status == "waiting")] | length')
          if [[ "$pending" -eq 0 ]]; then
            gh workflow run arena-training.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "Queued the next Arena training batch."
          else
            echo "Another Arena training batch is already waiting."
          fi

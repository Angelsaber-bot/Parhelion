# Every push to main builds and publishes Pages (parhelion-game). When Arena
# inputs change, its Worker is deployed and checked before publishing Pages.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; without them it builds only.
# Full regression suites remain available through npm scripts, but are not a deployment gate.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '**.command']
  workflow_dispatch:

# One deploy at a time; a newer push waits and then deploys the newest main.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ARENA_URL: wss://parhelion-arena.lejiazhang-us.workers.dev/arena
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Determine whether Arena Worker needs an update
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BEFORE"; then
              if git diff --quiet "$BEFORE" HEAD -- arena arena-game arena-maps shared-client; then
                echo "worker=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi
          echo "worker=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            arena-game/package-lock.json
            world/package-lock.json

      - name: Install
        run: |
          npm ci --prefix arena-game --no-audit --no-fund
          npm ci --prefix world --no-audit --no-fund

      - name: Build site (typechecks Arena + World)
        run: npm run build --prefix site
      - name: Check the build points at the public Arena server
        run: grep -rqF "$ARENA_URL" site/dist/public/arena

      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; built but not deployed."; fi

      # Worker first: a rules change must be live on the server before clients that expect it.
      - name: Deploy Arena Worker
        if: steps.secrets.outputs.ok == 'true' && steps.scope.outputs.worker == 'true'
        working-directory: arena-game
        run: npm run worker:deploy
      - name: Smoke test public Arena server
        if: steps.secrets.outputs.ok == 'true' && steps.scope.outputs.worker == 'true'
        working-directory: arena-game
        run: |
          # A newly deployed Worker can take a few seconds to reach every edge.
          # Each retry still runs all protocol, skin and gameplay assertions.
          for attempt in 1 2 3; do
            if npx tsx test/worker-smoke.ts "$ARENA_URL"; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          exit 1

      - name: Deploy site to Cloudflare Pages
        if: steps.secrets.outputs.ok == 'true'
        working-directory: arena-game
        run: >
          npx wrangler pages deploy ../site/dist/public --project-name parhelion-game --branch main
          --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --format=%s | cut -c1-200)" --commit-dirty=true

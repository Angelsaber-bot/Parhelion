name: Validate World Valley routes
on:
  pull_request:
    branches: [main]
    paths:
      - 'world/**'
permissions:
  contents: read
jobs:
  world-west-ridge:
    if: github.head_ref == 'codex/world-west-ridge-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: world
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: world/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: ./node_modules/.bin/tsc --noEmit
      - run: node --import tsx --test validation/mirror-lake-brace.test.ts
      - name: Report previous World deployment
        if: always()
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --retry 2 'https://api.github.com/repos/Angelsaber-bot/Parhelion/actions/runs?head_sha=ec86ff4531994312a9f9aa031eaa226149f2d257&event=push' | node -e 'const fs = require("node:fs"); for (const r of JSON.parse(fs.readFileSync(0)).workflow_runs) console.log(r.head_sha, r.conclusion, r.html_url)'
          curl --fail --silent --show-error --retry 2 'https://parhelion-game.pages.dev/world/' | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js'

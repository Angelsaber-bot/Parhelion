name: Validate Valley delivery and early observations
on:
  pull_request:
    branches: [main]
    paths:
      - 'world/**'
permissions:
  contents: read
jobs:
  world-west-ridge:
    if: github.head_ref == 'codex/world-west-ridge-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: world
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: world/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: ./node_modules/.bin/tsc --noEmit
      - run: node --import tsx --test validation/mirror-lake-brace.test.ts
      - run: node --import tsx --test --test-name-pattern='seven-region route' validation/world-journey.test.ts

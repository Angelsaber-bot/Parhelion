<!doctype html><html><body style="margin:0;background:#9fb4c8"><script type="module">
import * as THREE from 'three';
import { clone } from 'three/addons/utils/SkeletonUtils.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { createTroopKit, TROOP_VARIANTS, troopVariant } from '/src/troopKitVisual.ts';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); document.body.append(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x9fb4c8);
s.add(new THREE.HemisphereLight(0xffffff, 0x556070, 1.6)); const d = new THREE.DirectionalLight(0xffffff, 2.2); d.position.set(3, 5, 4); s.add(d);
const cam = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, .1, 60);
const model = new URLSearchParams(location.search).get('m') || 'sunward_guard';
const l = new GLTFLoader(); l.setMeshoptDecoder(MeshoptDecoder);
const g = await l.loadAsync(`/assets/enemies/${model}.glb`);
const kit = createTroopKit();
// one of each variant, forced by searching ids until each variant appears
const want = [...TROOP_VARIANTS].filter(v => v !== 'none');
const ids = []; for (let i = 0; ids.length < want.length && i < 4000; i++) { const id = 'wild_' + i; const v = troopVariant(id); if (v === want[ids.length]) ids.push(id); }
ids.forEach((id, i) => {
  const root = clone(g.scene); root.position.x = (i - (ids.length - 1) / 2) * 1.05; root.rotation.y = .35; s.add(root); root.updateMatrixWorld(true);
  kit.attach(root, id);
  const m = new THREE.AnimationMixer(root); const a = m.clipAction(g.animations.find(c => c.name === 'Idle') ?? g.animations[0]); a.play(); m.setTime(.3 + i * .2); root.updateMatrixWorld(true);
});
console.log('variants', ids.map(troopVariant).join(','));
const v = new URLSearchParams(location.search).get('v') || 'front';
if (v === 'front') { cam.position.set(0, 1.4, 5.1); cam.lookAt(0, 1.15, 0); } else { cam.position.set(0, 1.5, -5.1); cam.lookAt(0, 1.15, 0); }
r.render(s, cam); window.done = true;
</script></body></html>

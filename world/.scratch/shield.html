<!doctype html><html><body style="margin:0;background:#9fb4c8"><script type="module">
import * as THREE from 'three';
import { clone } from 'three/addons/utils/SkeletonUtils.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { createShieldKit } from '/src/shieldbearerVisual.ts';
import { createShinobiKit } from '/src/shinobiVisual.ts';
import { createPowderKit } from '/src/powderVisual.ts';
import { createJaegerKit } from '/src/jaegerVisual.ts';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); document.body.append(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x9fb4c8);
s.add(new THREE.HemisphereLight(0xffffff, 0x556070, 1.6)); const d = new THREE.DirectionalLight(0xffffff, 2.2); d.position.set(3, 5, 4); s.add(d);
const cam = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, .1, 50);
const l = new GLTFLoader(); l.setMeshoptDecoder(MeshoptDecoder);
const M = new URLSearchParams(location.search).get('m'), ninja = M === 'ninja' || M === 'powder' || M === 'jaeger';
const g = await l.loadAsync(M === 'jaeger' ? '/assets/enemies/musketeer.glb' : M === 'powder' ? '/assets/enemies/deck_raider.glb' : ninja ? '/assets/enemies/samurai.glb' : '/assets/enemies/sunward_guard.glb');
const kit = M === 'jaeger' ? createJaegerKit() : M === 'powder' ? createPowderKit() : ninja ? createShinobiKit() : createShieldKit();
const mk = (x, clip, t, yaw) => { const root = clone(g.scene); s.add(root); root.updateMatrixWorld(true); kit.attach(root); for (const n of ['forearmL','handL','upper_armL','chest']) { const v = root.getObjectByName(n).getWorldPosition(new THREE.Vector3()); console.log(n, v.toArray().map(x=>x.toFixed(2)).join(',')); } root.position.x = x; root.rotation.y = yaw; const m = new THREE.AnimationMixer(root); const a = m.clipAction(g.animations.find(c => c.name === clip) ?? g.animations.find(c => c.name === 'Idle') ?? g.animations[0]); a.play(); m.setTime(t); root.updateMatrixWorld(true); return root; };
mk(-1.1, 'Idle', .3, .35); mk(1.1, 'Attack_Windup', .5, -.5);
const v = new URLSearchParams(location.search).get('v') || 'front';
if (v === 'front') { if (ninja) { cam.position.set(-.6, 1.5, 3.4); cam.lookAt(-.6, 1.2, 0); } else { cam.position.set(0, 1.3, 5.2); cam.lookAt(0, 1, 0); } } else { cam.position.set(-2.6, 1.6, -2.6); cam.lookAt(-.6, 1.2, 0); }
r.render(s, cam); window.done = true;
</script></body></html>

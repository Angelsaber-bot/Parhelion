<!doctype html><html><body style="margin:0;background:#9fb4c8"><script type="module">
import * as THREE from 'three';
import { makeValleySentinel } from '/src/valleySentinel.ts';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); document.body.append(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x9fb4c8);
s.add(new THREE.HemisphereLight(0xffffff, 0x556070, 1.5)); const d = new THREE.DirectionalLight(0xffffff, 2.2); d.position.set(3, 5, 4); s.add(d);
const cam = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, .1, 60);
const geos = [], mats = [];
for (const [x, elite] of [[-1.5, false], [1.5, true]]) {
  const c = makeValleySentinel(geos, mats, elite); c.root.position.x = x; c.root.rotation.y = x < 0 ? .5 : -.9; s.add(c.root); c.update(1.2, true, false);
}
const v = new URLSearchParams(location.search).get('v') || 'front';
if (v === 'front') { cam.position.set(0, 1.9, 7.2); cam.lookAt(0, .95, 0); } else { cam.position.set(-4.2, 2.6, -4.6); cam.lookAt(-1.4, .95, 0); }
r.render(s, cam); window.done = true;
</script></body></html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Parhelion · Arena</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <canvas id="view"></canvas>

  <div id="hud" class="hidden">
    <div id="top">
      <div class="score tA" id="scoreA">0</div>
      <div class="mid"><div id="clock">—</div><div id="limit"></div></div>
      <div class="score tB" id="scoreB">0</div>
    </div>
    <div id="feed"></div>
    <div id="crosshair"></div>
    <div id="scope" class="hidden" aria-hidden="true"><div class="scope-ring"><i></i><b>HALO · 3.8×</b></div></div>
    <div id="hitmarker"></div>
    <div id="killpop"></div>
    <div id="hurt"></div>
    <div id="banner" class="hidden"></div>
    <div id="vitals">
      <div id="hpbar"><div id="hpfill"></div></div>
      <div id="hptext">150</div>
    </div>
    <div id="spawn-protection" class="hidden" role="status"></div>
    <div id="skills">
      <div class="skill" id="dash"><span>冲刺</span><kbd>Shift</kbd><b></b></div>
      <div class="skill" id="shield"><span>护盾</span><kbd>Q</kbd><b></b></div>
    </div>
    <div id="weapon">
      <div id="ammoline"><span id="ammo">30</span><span id="mag">/ 30</span></div>
      <div id="wname"></div>
      <div id="wslots"><span class="wslot"><kbd>1</kbd><small></small></span><span class="wslot"><kbd>2</kbd><small></small></span><span class="wslot"><kbd>3</kbd><small></small></span></div>
    </div>
    <div id="ping"></div>
    <div id="dead" class="hidden"><div>被 <b id="killer"></b> 击败</div><div><span id="respawn">3</span> 秒后重生</div></div>
    <div id="scoreboard" class="hidden"></div>
  </div>

  <div id="pause" class="overlay hidden">
    <div class="card small">
      <h2>已暂停</h2>
      <p class="muted onlineOnly" id="pausenote">联机对局仍在继续。</p>
      <button id="resume" class="primary">继续</button>
      <button id="settings-pause" type="button">操作设置</button>
      <button id="leave">退出到大厅</button>
    </div>
  </div>

  <div id="endcard" class="overlay hidden">
    <div class="card small">
      <div class="eyebrow">对局结束</div>
      <h2 id="endtitle">胜利</h2>
      <p class="muted" id="end-score-hint">读取计分板按键…</p>
      <button id="endscores" type="button">查看计分板 (S)</button>
      <button id="rematch" class="primary">再来一局</button>
      <button id="endleave">返回大厅</button>
    </div>
  </div>

  <div id="lobby" class="overlay">
    <div class="card lobby">
      <section class="lobby-main">
        <div class="eyebrow">ARENA</div>
        <h1 id="title">ASTER 研究站</h1>
        <h4>战场</h4>
        <div id="maps" class="maps"></div>
        <h4>角色</h4>
        <div id="chars" class="chars"></div>
        <h4>出战配装</h4>
        <div id="loadout" class="loadout" aria-label="出战配装"></div>
        <p id="loadout-status" class="muted" role="status" aria-live="polite"></p>
      </section>
      <section class="lobby-side">
        <div class="tabs">
          <button data-mode="offline" class="tab on">单机 vs Bot</button>
          <button data-mode="online" class="tab">联机</button>
        </div>
        <div class="grid">
          <label>名字<input id="name" maxlength="16" value="Max" /></label>
          <label>对局<select id="layout"><option>1v1</option><option>1v2</option><option selected>2v2</option></select></label>
          <label>队伍<select id="team"><option value="A">西 · 青</option><option value="B">东 · 橙</option><option value="auto" class="onlineOnly">自动</option></select></label>
          <label class="offlineOnly">Bot 难度<select id="difficulty"><option value="easy">简单</option><option value="normal" selected>普通</option><option value="hard">困难</option></select></label>
          <label class="onlineOnly">服务器<input id="server" /></label>
          <label class="onlineOnly check"><input type="checkbox" id="bots" /> 空位用 Bot 补齐</label>
        </div>
        <h4>外观</h4>
        <div id="skins" class="grid skins"></div>
        <button id="armory" type="button">旅人武装</button>
        <button id="settings-lobby" type="button">操作设置</button>
        <div id="error" class="error hidden"></div>
        <button id="play" class="primary"><span>开始战斗</span></button>
        <p id="control-hints" class="muted keys">读取操作设置…</p>
      </section>
    </div>
  </div>
  <div id="loading" class="overlay hidden"><div class="card small"><p>加载地图…</p></div></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>

# Public Arena server (Cloudflare Worker + Durable Objects). Deploy: npm run worker:deploy
# A separate Worker from the parhelion-game Pages project; the old game's project is never touched.
name = "parhelion-arena"
main = "index.ts"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "ArenaRoomDO"

# World co-op relay rooms (worker/worldRelay.ts)
[[durable_objects.bindings]]
name = "WORLD"
class_name = "WorldRoomDO"

# Human-only Arena weapon telemetry (GET/POST /stats)
[[durable_objects.bindings]]
name = "STATS"
class_name = "ArenaStats"

# SQLite-backed Durable Objects are available on the Workers free plan
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby", "ArenaRoomDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["WorldRoomDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ArenaStats"]
